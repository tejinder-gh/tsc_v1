name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint -- --max-diagnostics=200

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test

      - name: Verify Next.js production build
        run: npm run build

      - name: Check production dependencies for vulnerabilities
        run: npm audit --omit=dev --json
